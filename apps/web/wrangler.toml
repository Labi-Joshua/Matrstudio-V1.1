#:schema node_modules/wrangler/config-schema.json
# The marketing site: the static export in out/ served by a Cloudflare Worker with static assets.
# The Worker (worker/index.ts) only redirects www to the apex; assets are served straight from
# Cloudflare's network. The API is a separate Worker (packages/backend).
name = "matr-studio-web"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

workers_dev = false # production traffic uses matrstudio.com
routes = [
  { pattern = "matrstudio.com", custom_domain = true },
  { pattern = "www.matrstudio.com", custom_domain = true },
]

[assets]
directory = "./out"
binding = "ASSETS"
# /paths serves paths.html and /paths/ui-ux serves paths/ui-ux.html, like the static host before.
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
# Only page requests run the Worker (to redirect www); hashed JS/CSS and images skip it, so they
# are served directly and do not count as Worker requests.
run_worker_first = ["/*", "!/_next/*", "!/images/*"]
