name: Deploy web

# The marketing site (apps/web): a static export served by a Cloudflare Worker with static assets,
# at matrstudio.com. The API is deployed separately (deploy-backend.yml).
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "turbo.json"
      - "package.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch: # manual redeploy from the Actions tab

# One deploy at a time; never cancel a deploy that is already running.
concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  deploy:
    name: Deploy site Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build static export
        run: pnpm turbo run build --filter=@matr/web
      - name: Deploy Worker with static assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy
