#:schema node_modules/wrangler/config-schema.json
name = "matr-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

workers_dev = false # production traffic must use api.matr.studio, where the WAF rule and Cache API apply
routes = [{ pattern = "api.matr.studio", custom_domain = true }]

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://waitlist.matr.studio,https://matr.studio,https://app.matr.studio,https://admin.matr.studio"
PUBLIC_WEB_URL = "https://waitlist.matr.studio"
PUBLIC_API_URL = "https://api.matr.studio"
EMAIL_FROM = "Matr Studio <hello@matr.studio>"
R2_BUCKET_NAME = "matr-assets"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "matr-d1"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "matr-assets"

[[ratelimits]]
name = "SIGNUP_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[triggers]
crons = ["*/30 * * * *"]
